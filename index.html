<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarefas</title>
<meta name="description" content="Lista de tarefas compartilhada, offline, no celular.">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarefas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <h1>Tarefas</h1>
    <span class="sync" id="syncStatus" hidden></span>
    <button class="icon-btn" id="btnMenu" aria-label="Mais opções" title="Mais opções">⋯</button>
  </div>
</header>

<main id="main">
  <form class="add-row" id="formTarefa" autocomplete="off">
    <input type="text" id="inpTarefa" placeholder="Nova tarefa…" aria-label="Nova tarefa" maxlength="120" required>
    <button type="submit" class="btn primary" aria-label="Adicionar tarefa">+</button>
  </form>

  <button type="button" class="extras-toggle" id="btnExtras" aria-expanded="true">Detalhes <span class="arrow">▾</span></button>
  <div class="extras" id="extras">
    <div class="resumo" id="resumo"></div>
    <div class="add-extra">
      <label class="chip-input" id="campoPrazo">
        <span>📅</span>
        <input type="date" id="inpPrazo" aria-label="Prazo">
      </label>
      <select id="selPrioridade" aria-label="Prioridade">
        <option value="0">Normal</option>
        <option value="1">Importante</option>
        <option value="2">Urgente</option>
      </select>
    </div>
  </div>

  <div class="toolbar">
    <div class="seg" id="filtro" role="tablist">
      <button data-filtro="pendentes" class="on">Pendentes</button>
      <button data-filtro="todas">Todas</button>
      <button data-filtro="concluidas">Concluídas</button>
    </div>
  </div>

  <div class="grupos" id="barraGrupos"></div>
  <p class="hint" id="dica"></p>
  <div id="lista" class="lista"></div>
</main>

<!-- ============ MENU ============ -->
<div class="sheet-bg hidden" id="menuBg"></div>
<div class="sheet hidden" id="menu" role="dialog" aria-label="Opções">
  <button class="sheet-item" id="mnInstalar" hidden>📲 Instalar no celular</button>
  <button class="sheet-item" id="mnPrazo">📅 Usar prazo nas tarefas <span class="switch" id="swPrazo"></span></button>
  <button class="sheet-item" id="mnDois">👥 Duas bolinhas por tarefa <span class="switch" id="swDois"></span></button>
  <hr>
  <button class="sheet-item" id="mnGrupos">🗂️ Grupos…</button>
  <hr>
  <button class="sheet-item danger" id="mnLimparConcluidas">🧹 Apagar tarefas concluídas</button>
  <hr>
  <button class="sheet-item" id="mnExportar">💾 Exportar backup</button>
  <label class="sheet-item">📂 Importar backup <input type="file" id="inpImportar" accept="application/json" hidden></label>
  <hr>
  <button class="sheet-item" id="mnFechar">Fechar</button>
</div>

<!-- ============ GRUPOS ============ -->
<div class="sheet-bg hidden" id="gruposBg"></div>
<div class="sheet hidden" id="grupos" role="dialog" aria-label="Grupos">
  <h2 class="sheet-title">Grupos</h2>
  <div id="listaGrupos" class="lista"></div>
  <form class="add-row" id="formGrupo" autocomplete="off">
    <input type="text" id="inpGrupo" placeholder="Novo grupo… (ex: Casa, Mercado)" maxlength="30" required>
    <button type="submit" class="btn primary" aria-label="Criar grupo">+</button>
  </form>
  <div class="sheet-actions"><span class="grow"></span><button type="button" class="btn ghost" id="gruposFechar">Fechar</button></div>
</div>

<!-- ============ EDITAR ============ -->
<div class="sheet-bg hidden" id="editBg"></div>
<div class="sheet hidden" id="edit" role="dialog" aria-label="Editar tarefa">
  <form id="formEditar">
    <div class="field"><label for="edTexto">Tarefa</label><input type="text" id="edTexto" maxlength="120" required></div>
    <div class="field" id="edCampoPrazo"><label for="edPrazo">Prazo</label><input type="date" id="edPrazo"></div>
    <div class="field"><label for="edPrio">Prioridade</label>
      <select id="edPrio"><option value="0">Normal</option><option value="1">Importante</option><option value="2">Urgente</option></select>
    </div>
    <div class="field" id="edCampoGrupo"><label for="edGrupo">Grupo</label><select id="edGrupo"></select></div>
    <div class="field"><label for="edNota">Observação</label><input type="text" id="edNota" maxlength="200" placeholder="opcional"></div>
    <div class="sheet-actions">
      <button type="button" class="btn danger" id="edApagar">Apagar</button>
      <span class="grow"></span>
      <button type="button" class="btn ghost" id="edCancelar">Cancelar</button>
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>
</div>

<div class="toast hidden" id="toast"></div>

<script src="./config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./assets/js/app.js"></script>
</body>
</html>
