<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarefas</title>
<meta name="description" content="Listas de tarefas privadas e compartilhadas, com check por pessoa.">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarefas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./assets/css/style.css?v=16">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <button class="icon-btn hidden" id="btnVoltar" aria-label="Voltar">‹</button>
    <h1 id="titulo">Tarefas</h1>
    <span class="sync" id="syncStatus" hidden></span>
    <button class="icon-btn hidden" id="btnMenu" aria-label="Mais opções" title="Mais opções">⋯</button>
  </div>
</header>

<main id="main">

  <!-- ============ LOGIN ============ -->
  <section class="view hidden" id="view-auth">
    <div class="auth-card">
      <div class="auth-logo">✅</div>
      <h2 id="authTitulo">Entrar</h2>
      <form id="formAuth" autocomplete="on">
        <div class="field"><label for="authEmail">E-mail</label><input type="email" id="authEmail" autocomplete="email" required></div>
        <div class="field"><label for="authSenha">Senha</label><input type="password" id="authSenha" autocomplete="current-password" minlength="6" required></div>
        <div class="field hidden" id="authCampoNome"><label for="authNome">Seu nome</label><input type="text" id="authNome" maxlength="40" autocomplete="name"></div>
        <p class="auth-erro hidden" id="authErro"></p>
        <button type="submit" class="btn primary wide" id="authBotao">Entrar</button>
      </form>
      <button class="btn ghost wide" id="authTrocar">Não tem conta? Criar cadastro</button>
    </div>
  </section>

  <!-- ============ LISTAS ============ -->
  <section class="view hidden" id="view-listas">
    <div id="listaListas" class="lista"></div>
    <button class="btn primary wide big" id="btnNovaLista">+ Nova lista</button>
    <button class="btn ghost wide" id="btnEntrarCodigo">Tenho um código de convite</button>
  </section>

  <!-- ============ LISTA (tarefas) ============ -->
  <section class="view hidden" id="view-lista">
    <form class="add-row" id="formTarefa" autocomplete="off">
      <input type="text" id="inpTarefa" placeholder="Nova tarefa…" aria-label="Nova tarefa" maxlength="120" required>
      <button type="submit" class="btn primary" aria-label="Adicionar tarefa">+</button>
    </form>

    <button type="button" class="extras-toggle" id="btnExtras" aria-expanded="true">Detalhes <span class="arrow">▾</span></button>
    <div class="extras" id="extras">
      <div class="resumo" id="resumo"></div>
      <div class="add-extra">
        <label class="chip-input" id="campoPrazo">
          <span>📅</span>
          <input type="date" id="inpPrazo" aria-label="Prazo">
        </label>
        <select id="selPrioridade" aria-label="Prioridade">
          <option value="0">Normal</option>
          <option value="1">Importante</option>
          <option value="2">Urgente</option>
        </select>
      </div>
    </div>

    <div class="toolbar">
      <div class="seg" id="filtro" role="tablist">
        <button data-filtro="pendentes" class="on">Pendentes</button>
        <button data-filtro="todas">Todas</button>
        <button data-filtro="concluidas">Concluídas</button>
      </div>
    </div>

    <div class="grupos" id="barraGrupos"></div>
    <p class="hint" id="dica">Toque para concluir · segure para editar</p>
    <div id="lista" class="lista"></div>
  </section>

</main>

<!-- ============ MENU DA TELA DE LISTAS ============ -->
<div class="sheet-bg hidden" id="menuListasBg"></div>
<div class="sheet hidden" id="menuListas" role="dialog" aria-label="Opções">
  <p class="hint" id="menuUsuario"></p>
  <button class="sheet-item" id="mnInstalar" hidden>📲 Instalar no celular</button>
  <button class="sheet-item" id="mnSair">🚪 Sair da conta</button>
  <hr>
  <button class="sheet-item" id="menuListasFechar">Fechar</button>
</div>

<!-- ============ MENU DA LISTA ============ -->
<div class="sheet-bg hidden" id="menuBg"></div>
<div class="sheet hidden" id="menu" role="dialog" aria-label="Opções da lista">
  <button class="sheet-item" id="mnPrazo">📅 Usar prazo nas tarefas <span class="switch" id="swPrazo"></span></button>
  <button class="sheet-item" id="mnGrupos">🗂️ Grupos…</button>
  <hr>
  <button class="sheet-item" id="mnMembros">👥 Compartilhar / pessoas da lista…</button>
  <button class="sheet-item" id="mnRenomear">✏️ Renomear lista</button>
  <hr>
  <button class="sheet-item" id="mnDesmarcarTodas">🔄 Desmarcar todas as tarefas</button>
  <button class="sheet-item danger" id="mnApagarLista">🗑️ Apagar lista</button>
  <button class="sheet-item danger" id="mnSairLista">🚪 Sair desta lista</button>
  <hr>
  <button class="sheet-item" id="mnFechar">Fechar</button>
</div>

<!-- ============ NOVA LISTA ============ -->
<div class="sheet-bg hidden" id="novaListaBg"></div>
<div class="sheet hidden" id="novaLista" role="dialog" aria-label="Nova lista">
  <form id="formNovaLista" autocomplete="off">
    <h2 class="sheet-title">Nova lista</h2>
    <div class="field"><label for="nlNome">Nome</label><input type="text" id="nlNome" maxlength="40" placeholder="ex: Casa, Viagem, Mercado" required></div>
    <div class="tipo-lista">
      <label class="tipo"><input type="radio" name="nlTipo" value="privada" checked><span><b>🔒 Privada</b><small>Só você vê</small></span></label>
      <label class="tipo"><input type="radio" name="nlTipo" value="compartilhada"><span><b>👥 Compartilhada</b><small>Convide pessoas pelo e-mail; cada uma tem seu check</small></span></label>
    </div>
    <div class="sheet-actions"><span class="grow"></span><button type="button" class="btn ghost" id="nlCancelar">Cancelar</button><button type="submit" class="btn primary">Criar</button></div>
  </form>
</div>

<!-- ============ PESSOAS DA LISTA ============ -->
<div class="sheet-bg hidden" id="membrosBg"></div>
<div class="sheet hidden" id="membros" role="dialog" aria-label="Pessoas da lista">
  <h2 class="sheet-title">Pessoas da lista</h2>
  <div class="convite hidden" id="conviteBox"><span>Código: <b id="conviteCodigo"></b></span><button type="button" class="btn ghost" id="btnCopiarCodigo">Copiar</button><button type="button" class="btn ghost" id="btnLinkConvite">Enviar</button></div>
  <div id="listaMembros" class="lista"></div>
  <form class="add-row" id="formConvite" autocomplete="off">
    <input type="email" id="inpConvite" placeholder="E-mail de quem vai entrar" required>
    <button type="submit" class="btn primary" aria-label="Convidar">+</button>
  </form>
  <p class="hint" id="membrosDica"></p>
  <div class="sheet-actions"><span class="grow"></span><button type="button" class="btn ghost" id="membrosFechar">Fechar</button></div>
</div>

<!-- ============ ESCOLHER GRUPO (ao adicionar) ============ -->
<div class="sheet-bg hidden" id="escolherGrupoBg"></div>
<div class="sheet hidden" id="escolherGrupo" role="dialog" aria-label="Escolher grupo">
  <h2 class="sheet-title">Em qual grupo?</h2>
  <p class="hint" id="escolherGrupoTexto"></p>
  <div class="opcoes-grupo" id="opcoesGrupo"></div>
</div>

<!-- ============ GRUPOS ============ -->
<div class="sheet-bg hidden" id="gruposBg"></div>
<div class="sheet hidden" id="grupos" role="dialog" aria-label="Grupos">
  <h2 class="sheet-title">Grupos</h2>
  <div id="listaGrupos" class="lista"></div>
  <form class="add-row" id="formGrupo" autocomplete="off">
    <input type="text" id="inpGrupo" placeholder="Novo grupo… (ex: Casa, Mercado)" maxlength="30" required>
    <button type="submit" class="btn primary" aria-label="Criar grupo">+</button>
  </form>
  <h3 class="sec-title">Sugestões prontas</h3>
  <div class="seg" id="filtroSugestoes"><button data-tag="viagem" class="on">✈️ Viagem</button><button data-tag="camping">⛺ Camping</button><button data-tag="casa">🏠 Casa</button></div>
  <div class="sugestoes" id="listaSugestoes"></div>
  <div class="sheet-actions"><span class="grow"></span><button type="button" class="btn ghost" id="gruposFechar">Fechar</button></div>
</div>

<!-- ============ EDITAR TAREFA ============ -->
<div class="sheet-bg hidden" id="editBg"></div>
<div class="sheet hidden" id="edit" role="dialog" aria-label="Editar tarefa">
  <form id="formEditar">
    <div class="field"><label for="edTexto">Tarefa</label><input type="text" id="edTexto" maxlength="120" required></div>
    <div class="field" id="edCampoPrazo"><label for="edPrazo">Prazo</label><input type="date" id="edPrazo"></div>
    <div class="field"><label for="edPrio">Prioridade</label>
      <select id="edPrio"><option value="0">Normal</option><option value="1">Importante</option><option value="2">Urgente</option></select>
    </div>
    <div class="field" id="edCampoGrupo"><label for="edGrupo">Grupo</label><select id="edGrupo"></select></div>
    <div class="field"><label for="edNota">Observação</label><input type="text" id="edNota" maxlength="200" placeholder="opcional"></div>
    <p class="hint" id="edQuem"></p>
    <div class="sheet-actions">
      <button type="button" class="btn danger" id="edApagar">Apagar</button>
      <span class="grow"></span>
      <button type="button" class="btn ghost" id="edCancelar">Cancelar</button>
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>
</div>

<div class="toast hidden" id="toast"></div>

<script src="./config.js?v=16"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./assets/js/sugestoes.js?v=16"></script>
<script src="./assets/js/app.js?v=16"></script>
</body>
</html>
